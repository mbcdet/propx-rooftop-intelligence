# Pipeline thresholds.
#
# Every value here is a DOCUMENTED HEURISTIC chosen to be conservative. None is a calibrated
# accuracy figure. Where a threshold was picked from measured evidence, the evidence and the
# buildings it was measured on are cited at the threshold itself - see image.solar_panels
# below, two of whose gates were calibrated from pixels on vie-swv-001 and vie-swv-003 inside
# the selected sample. No threshold was moved after a visual spot check to change a verdict.

crs:
  # Every published metric value comes from this projected CRS via pyproj. The local
  # cos(latitude) scaling used in reconnaissance is diagnostic-only and may not produce
  # published values.
  metric: "EPSG:31256"
  # SPECIFIED, NOT IMPLEMENTED: no code reads crs.imagery. The imagery CRS is fixed by the WMTS
  # google3857 tile matrix in sources/wmts.py, so this key documents the frame rather than
  # setting it. Kept because deleting it would change config_hash for no behavioural reason.
  imagery: "EPSG:3857"

imagery:
  layer: "lb2024"
  zoom: 20
  native_gsd_m: 0.15
  # Crop margin around each roof outline. 12 m keeps every selected building inside the
  # committed tile cache and gives GrabCut ~120 px of background ring at 0.0995 m/px.
  crop_margin_m: 12.0

join:
  # FMZK is fetched for the study bbox expanded by this buffer BEFORE dissolving, so units
  # extending outside the bbox are not truncated. Reconnaissance measured 22 of 54 matched
  # units truncated without a buffer, which depresses IoU for reasons unrelated to the data.
  fmzk_buffer_m: 150.0
  min_iou: 0.50            # below this the match is flagged ambiguous
  ambiguity_margin: 0.70   # second_best_iou / best_iou above this is flagged ambiguous
  # --- stage 6 enrichment joins (GEBAEUDETYPOGD polygons, GEBAEUDEINFOOGD points) ------------
  # Minimum fraction of the authoritative roof outline that the best-overlapping typology
  # polygon must cover before its attributes are published. 0.5 is the majority principle,
  # not a calibrated figure: the polygon must describe at least half of the roof, and below
  # half it more likely describes a neighbouring building than this one, so the value is
  # WITHHELD (null, not_in_source semantics) with the measured share and this floor recorded
  # in source_detail. A documented heuristic, chosen on principle and not tuned to any
  # building in the sample.
  typology_min_overlap: 0.50
  # Second-best / best overlap-share ratio above which the typology enrichment is ambiguous:
  # two polygons compete for the roof. Deliberately the same value and construction as
  # ambiguity_margin above for the FMZK join, on the same reasoning; a value published under
  # this condition carries an ambiguous_enrichment review flag, and every candidate share is
  # recorded either way.
  typology_ambiguity_margin: 0.70
  # Two GEBAEUDEINFOOGD points whose distances to the roof centroid differ by less than this
  # are treated as equidistant by the nearest-point rule: at sub-metre separation the
  # placement of an address point inside a footprint does not support an ordering, so the
  # nearest point is still published but the choice is flagged for review rather than
  # presented as clean. A documented heuristic.
  point_tie_epsilon_m: 1.0

roof_type:
  # DACHFORM is the primary source. These thresholds were the documented FALLBACK for records
  # with no 2025 roof record. Reconnaissance measured the fallback disagreeing with DACHFORM on
  # 25.9% of records in this study area, which is why it is not primary.
  #
  # SPECIFIED, NOT IMPLEMENTED: no code reads either key. Every pinned building has a 2025 roof
  # record, so the fallback path was never built and no published roof_type comes from a slope
  # threshold. The 10-15 deg gap between them is therefore NOT a live abstain band. Kept rather
  # than deleted because deleting them would change config_hash for no behavioural reason.
  fallback_flat_below_deg: 10.0
  fallback_pitched_above_deg: 15.0
  # Unusual for a whole-roof mean but not impossible (steep mansard, tower, spire). Flags for
  # visual review only; no value is rejected on this threshold alone.
  slope_review_above_deg: 60.0

confidence:
  base:
    authoritative: 0.95
    derived: 0.85
    observed: 0.80
    inferred: 0.65
  # Multiplicative penalties, each in [0.5, 1.0], at most three per attribute. Four entries are
  # marked LIVE; the other two are SPECIFIED, NOT
  # IMPLEMENTED - no code path asks for them, so they cannot reduce any published score. Kept
  # rather than deleted because deleting them would change config_hash for no behavioural
  # reason, and because the values are still the specification a future implementation follows.
  penalty:
    source_recency: 0.95        # LIVE. 2023/2025 model inputs read against 2024 imagery
    image_conflict: 0.70        # LIVE. authoritative class disagrees with image evidence
    # LIVE floor for typology enrichment. The effective factor is the measured fraction of the
    # authoritative roof covered by the best-overlapping typology polygon, clipped to this floor
    # and 1.0. This is a transparent heuristic reliability reduction, not a calibrated curve.
    typology_overlap_floor: 0.50
    join_ambiguous: 0.85        # SPECIFIED, NOT IMPLEMENTED - never requested
    threshold_margin_min: 0.75  # SPECIFIED, NOT IMPLEMENTED - never requested; was to apply
                                # when a value sits near a class boundary
    shadow_heavy: 0.70          # SUBSUMED (RTI-008): the fixed step penalty is replaced by the
                                # continuous judgeable_fraction evidence factor below, which
                                # measures the same condition (how much of the roof was
                                # readable) without a cliff at one threshold. Kept as the
                                # documented value a step-penalty implementation would use.
  # Anchor points for the evidence-sensitive factors (RTI-008). confidence.evidence_factor maps
  # a MEASURED per-building quality quantity linearly from [lo, hi] onto a penalty factor in
  # [0.5, 1.0], clipped at both ends. One principle fixes every anchor rather than per-entry
  # tuning: lo is the existing publishability gate for that quantity - evidence that only just
  # clears the gate is the weakest evidence permitted to publish at all, so it earns the
  # strongest discount the confidence model allows (0.5, design section 6) - and hi is the
  # ideal measurement, which earns no discount (1.0). The measured input for every factor is
  # published in the attribute's image_evidence.quality, so a reader can reproduce the factor
  # and the score by hand. None of this is calibration: the factors make the published score
  # co-vary with the published evidence instead of being one constant across buildings whose
  # evidence differs, and the not-calibrated note stays on every record.
  evidence_factor:
    # lo = image.min_judgeable_fraction (the whole-roof judgeability gate); hi = the entire
    # outline judgeable.
    judgeable_fraction: {lo: 0.65, hi: 1.0}
    # lo = image.surface.min_dominance_margin (below it the classifier abstains); hi = total
    # separation (the leading signature owns every judgeable pixel and the runner-up none).
    surface_margin: {lo: 0.15, hi: 1.0}
    # For "mixed" verdicts, whose evidence is the combined share of the two signatures, not the
    # margin between them. lo = attributes.ATTRIBUTE_PARAMS mixed_pair_share_min (the gate that
    # permitted the verdict); hi = the pair owning every judgeable pixel.
    surface_pair_share: {lo: 0.70, hi: 1.0}
    # lo = image.green_roof.negative_min_judgeable_fraction (the gate below which a vegetation
    # negative is not permitted — the anchor moved with that gate when it was raised from the
    # whole-roof 0.65 to the review-quality floor, keeping the principle above: evidence that
    # only just clears the gate earns the strongest discount); hi = the entire outline imaged
    # and unshadowed.
    vegetation_judgeable_fraction: {lo: 0.75, hi: 1.0}
    # Measured as |vegetated_fraction - min_coverage_fraction| / min_coverage_fraction, i.e.
    # the distance of the measured vegetated share from the deciding threshold in units of that
    # threshold. lo = a verdict exactly at the threshold (which could flip with one JPEG block);
    # hi = a full threshold's width away.
    vegetation_index_margin: {lo: 0.0, hi: 1.0}
    # The ridge detector's gate_margin: the minimum signed margin across its quality gates, each
    # in units of its own threshold. lo = a ridge that only just cleared its weakest gate; hi =
    # every gate cleared by at least its own threshold's width again.
    ridge_gate_margin: {lo: 0.0, hi: 1.0}
  # Absence of evidence is weak evidence of absence.
  negative_detection_cap: 0.45
  # Caps for every attribute in design §5. Incomplete coverage here means an attribute
  # publishes uncapped, so the list must match the design table exactly.
  positive_cap:
    solar_panels: 0.75
    green_roof: 0.65
    visual_surface_appearance: 0.60  # renamed from roof_surface_class: the value is an
                                     # appearance, not a material or construction class
    roof_type_authoritative: 0.90
    ridge_orientation: 0.70
    roof_area_m2: 0.85
    roof_subtype: 0.60
    footprint_axis_orientation_deg: 0.80
    mean_slope_deg: 0.90
    pv_potential_kwp: 0.90
    pv_potential_annual_yield_kwh: 0.90
    pv_suitability_area_m2: 0.90
    construction_epoch: 0.95
    building_typology: 0.95
    year_built: 0.95
    architect: 0.95
    address: 0.95

image:
  # --- shadow / judgeability -----------------------------------------------------------------
  # A roof pixel is unjudgeable for colour and texture when it is dark in ABSOLUTE terms or
  # markedly darker than the roof's own lit reference (RELATIVE). The absolute-only threshold
  # of 55 was measured inactive on this imagery: every one of the ten pinned roofs reported
  # shadow_fraction 0.0 because cast shadow in a sun-lit orthophoto sits at luminance ~75-95,
  # far above 55. The relative term is the live detector; the absolute values bound it.
  #
  # Principle for the relative ratio (0.5), from illumination physics rather than from any
  # building: a surface in cast shadow is lit by sky only, receiving ~15-25% of the global
  # irradiance a sun-plus-sky surface receives at March sun elevations in Vienna (~38-42 deg).
  # Through the roughly gamma-1/2.2 encoding of 8-bit imagery a linear ratio of 0.15-0.25
  # encodes to pixel ratios of ~0.42-0.53, so 0.5 sits inside the physical band for cast
  # shadow. The darker plane of a pitched roof still sees partial sun or a full sky view: its
  # measured plane contrast against the lit plane is 0.23-0.29 (see ridge_plane_contrast_min),
  # i.e. encoded ratios 0.55-0.63, ABOVE 0.5 - so self-shaded pitched planes stay judgeable and
  # only illumination boundaries (cast shadow) are excluded. Nothing here is per-building.
  shadow_luminance_threshold: 55   # absolute floor: below JPEG noise there is no signal at all
  shadow_relative_ratio: 0.5       # of the lit-reference luminance; rationale above
  # The lit reference is a high percentile of roof pixels that have imagery: p75 stays inside
  # the lit mode as long as at least a quarter of the roof is lit, and is robust to up to 25%
  # bright outliers (ridge caps, skylights, specular metal) from above.
  shadow_reference_percentile: 75
  # Above this absolute luminance a pixel is never called shadow, whatever the relative test
  # says: it carries enough signal to judge colour and texture on its own. Anchored by the
  # solar calibration below, which measured genuinely judgeable content (module pixels) at
  # V 113-128; the lit surfaces of this imagery sit at p25 >= ~117.
  shadow_luminance_ceiling: 110
  # Whole-roof abstention gate: nothing-detected over a roof more shadowed than this is
  # `unknown`, never a negative. Equivalently, a negative claim needs at least 65% of the roof
  # judgeable (min_judgeable_fraction below is its complement, used where the question is
  # asked per attribute).
  shadow_fraction_abstain: 0.35
  min_judgeable_fraction: 0.65
  solar_panels:
    # Dark, low-saturation, regularly spaced rectangular clusters.
    #
    # max_value was set a priori at 110 and MEASURED WRONG against this imagery. On the two
    # roofs that are unambiguously module-covered at 10 cm/px (vie-swv-001 / 351705 and
    # vie-swv-003 / 351704) the module pixels sit at mean V 113-128, with roof V p25/p50 =
    # 127/144 on 001. At V<=110 the candidate mask captured parapet shadow instead of panels
    # (clusters of 215 m2 and 76 m2 with internal texture 14.0/19.7 - smooth, i.e. shadow);
    # at V<=145 the array resolves as one 933 m2 cluster with texture 34.1.
    #
    # This is instrument calibration against measured pixel values, not fitting to a desired
    # answer. The control is green_roof below: it was NOT adjusted, and both of its visual
    # candidates remain negative. Precision is protected by the internal-texture gate
    # (module grids 27-38, shaded planes 8-22), which removed four false positives.
    max_value: 145
    max_saturation: 70
    min_cluster_area_m2: 8.0
    min_coverage_fraction: 0.03
  green_roof:
    # RGB-only vegetation index. There is no NIR band, and the March/April 2024 imagery has
    # DORMANT vegetation, so sedum roofs read reddish-brown. Under-detection is expected and
    # `unknown` is an accepted output. These are NOT tuned to make the two visual candidates
    # come out positive.
    exg_threshold: 0.06
    min_coverage_fraction: 0.10
    # A `not_detected` verdict additionally requires at least this share of the outline imaged
    # and unshadowed (the vegetation judgeability); below it the observation abstains (null).
    # General principle, not a building exception: the whole-roof abstention gate above
    # (shadow_fraction_abstain, i.e. judgeability >= 0.65) is the floor for LOOKING at all,
    # but a negative that would immediately sit below the documented review-quality floor
    # (review.judgeable_fraction_review / review.vegetation_judgeable_review = 0.75 - "a
    # quarter of the roof unreadable") rests on too little of the roof to be defensible even
    # as a hedged not_detected: the unread quarter could hold the vegetated share the verdict
    # denies. So the negative gate is deliberately set equal to that review-quality floor -
    # below it the honest output is unknown, and the raw index diagnostics stay published.
    # Positive detections are unaffected: evidence present is evidence, shadowed or not.
    negative_min_judgeable_fraction: 0.75
  ridge:
    # Quality gates on the strongest ridge candidate, each rejecting a specific known
    # impostor. All are stated as general geometric/photometric principles; none was set to
    # change any particular building's verdict.
    #
    # A ridge is a CREST: in plan it runs along the local medial axis of its roof section,
    # because every interior point of a pitched section drains to one of the two eaves and the
    # crest is where the two distances meet. A facade edge, parapet, terrace/deck step or
    # ortho-rectification lean artefact is the BOUNDARY of a sub-roof, off the medial axis.
    # The statistic is scale-free: for sample points along the supporting segment, the
    # perpendicular roof chord is walked to where it leaves the roof on each side, and the
    # median of (distance to the nearer exit) / (half the chord) is taken. A symmetric gable
    # scores 1.0; a plane-width asymmetry of 40/60 scores 0.8, which is the tolerance granted
    # here. Roofs more asymmetric than that are withheld - a recall cost accepted
    # deliberately, consistent with the package-wide precision-over-recall stance (an
    # invented ridge is published misinformation; a missed one is an abstention).
    # Deliberately NOT an absolute metre threshold: an absolute clearance would reject genuine
    # ridges on narrow wings and admit off-axis edges on large halls.
    medial_axis_ratio_min: 0.8
    # A ridge separates two LIT planes of different aspect; a shadow boundary separates lit
    # roof from cast shadow. Both produce a brightness step, so the step alone cannot tell
    # them apart - but on a shadow boundary the dark flank is classified shadow by the
    # adaptive detector above. The overlap is measured over the full flanking band (a third of
    # to twice the plane-sampling offset), not one line of pixels, so dappled shadow (trees,
    # masts) cannot slip between two sample rows. 15% tolerates cast specks from chimneys and
    # dormers on a genuinely lit plane; a flank materially in shadow means the step is an
    # illumination boundary and no ridge is reported.
    shadow_flank_overlap_max: 0.15
    # Roof-form prior: the main ridge of a pitched roof runs parallel to a dominant footprint
    # direction (the long axis for gables and hips, the short axis for cross-gables). The two
    # rectangle axes are 90 deg apart, so the candidate can be at most 45 deg from the nearer
    # one; 30 deg rejects only strongly diagonal lines (shadow edges, plant rows, seams cut
    # across the footprint) while every axis-parallel articulation passes. Applied only when
    # the authoritative outline is available to measure the axes from.
    axis_alignment_tolerance_deg: 30.0
  roof_form:
    # Symmetric image evidence for flat-versus-pitched (RTI-005). "pitched" needs a gated
    # ridge; "flat" needs POSITIVE evidence of flatness, not merely a missed ridge:
    #
    # * plane contrast: the same physical statistic the ridge detector demands
    #   (ridge_plane_contrast_min = 0.15, measured 0.23-0.29 on pitched roofs here and
    #   0.09-0.13 on flat ones). If the best two-mode split of the judgeable interior's
    #   brightness stays below what a single ridge boundary would need, no two
    #   differently-facing planes are present. Using the SAME threshold keeps the two
    #   directions of evidence symmetric by construction.
    flat_plane_contrast_max: 0.15
    # * and enough of the roof must have been judgeable to support the claim; the complement
    #   of shadow_fraction_abstain, stated per attribute.
    min_judgeable_fraction: 0.65
  surface:
    # Appearance classification abstains (None) rather than publishing a weak class:
    # * when less than min_judgeable_fraction of the roof is judgeable (shadow / no data), or
    # * when the leading signature's pixel share beats the runner-up by less than
    #   min_dominance_margin. A 15-point share margin is the movement observed from small
    #   perturbations of the class boundaries (+-5 luminance / +-0.02 index) on JPEG imagery;
    #   a verdict thinner than its own sensitivity is noise wearing a label.
    min_judgeable_fraction: 0.65
    min_dominance_margin: 0.15

review:
  # Evidence-driven review routing (RTI-004). Every threshold here is a general principle
  # applied to a measured quantity that is computed for every building; none is keyed to a
  # building id, and none was chosen to make a particular building fire. The real-sample
  # effects were measured AFTER these values were fixed and are reported in the remediation
  # notes, not encoded here. A review flag is an invitation to look, never an edit: no value is
  # changed, withheld or promoted by anything in this section.
  #
  # A quarter of the roof unreadable: past that point every whole-roof statement (an appearance
  # class, a vegetation negative, a shadow-gated abstention that did NOT fire) rests on
  # materially less evidence than its wording suggests, and a reader scanning only values would
  # never see it. Measured by the adaptive shadow detector, so cast shadow and missing imagery
  # both count.
  shadow_fraction_review: 0.25
  # The complement of shadow_fraction_review, applied to the chromatic judgeable fraction
  # (which additionally excludes no-data pixels). Either measurement crossing its line flags
  # the building once.
  judgeable_fraction_review: 0.75
  # CV/authoritative agreement floor for review, applied only when a CV candidate exists.
  # Principle: on a compact roof at this sample's typical scale (~25 m across), a uniform
  # boundary offset equal to this imagery's eave/parapet ambiguity band (~0.5-0.6 m - the
  # visual audit repeatedly records outward bias "not separable from a parapet/eave at this
  # GSD") yields IoU = (1 - 2*0.6/25)^2 ~= 0.906. Agreement below 0.90 therefore implies
  # divergence beyond what boundary ambiguity alone explains, so a human should look at which
  # estimate wandered. A topology mismatch (differing interior-ring counts) reaches the same
  # flag: the two estimates disagree about the roof's structure, not merely its edge.
  cv_iou_review_floor: 0.90
  # How many image-derived attributes must abstain before the BUILDING is flagged as one the
  # imagery serves poorly. One abstention is routine - the ridge detector abstains on most flat
  # roofs by design - but two of the four image observations abstaining on one roof is a
  # pattern about the imagery, not about any single detector.
  withheld_attributes_min: 2
  # Attribute-level review margins (RTI-004 part 2): a published value whose deciding statistic
  # sits this close to its own gate is legal to publish but merits eyes, and carries
  # requires_review + review_reasons on the attribute itself.
  #
  # The weakest ridge gate cleared by less than a quarter of its own threshold: the detection
  # stands, but a modest remeasurement could have withheld it.
  ridge_gate_margin_review: 0.25
  # Within one additional sensitivity band (0.15, the abstention margin itself) of the 0.15
  # dominance gate: the class is publishable but a small perturbation of the class boundaries
  # would materially narrow it. Applies to single-class verdicts; a "mixed" verdict does not
  # rest on the dominance margin.
  surface_margin_review: 0.30
  # A vegetation negative published over a roof whose unshadowed, imaged share is below this:
  # the negative cleared the 0.65 abstention gate, but the same complement-of-a-quarter
  # principle as judgeable_fraction_review says a human should confirm it.
  vegetation_judgeable_review: 0.75
