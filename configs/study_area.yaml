# Study area and pinned building units for the PropX rooftop assessment.
# Generated from the Phase 2 reconnaissance on 2026-08-03 and reviewed visually.
# Source: City of Vienna open data, CC BY 4.0.
# Attribution: "Datenquelle: Stadt Wien - data.wien.gv.at"

study_area:
  name: "sonnwendviertel"
  label: "Sonnwendviertel / Wiedner Guertel, Vienna 3rd / 4th / 10th districts"
  bbox_wgs84: [16.3760, 48.1830, 16.3820, 48.1880]
  crs_metric: "EPSG:31256"
  imagery_zoom: 20

sources:
  imagery:
    name: "Orthofoto 2024 Wien"
    layer: "lb2024"
    endpoint: "https://mapsneu.wien.gv.at/wmts/lb2024/farbe/google3857/{z}/{row}/{col}.jpeg"
    native_gsd_m: 0.15
    flight_dates: ["2024-03-19", "2024-03-20", "2024-03-29", "2024-04-12"]
    fetched: "2026-08-03"
  roof_record:
    name: "PV-Potenzial 2025 / Anlagenleistung"
    layer: "ogdwien:ANLAGENLEISTUNG2025OGD"
    model_basis: "2023 laser-scan surface model (DOM) at 7.5 cm; 2025 aerial imagery; 1 m DGM for far shading"
    feature_count_citywide: 191625
    fetched: "2026-08-03"
  building_parts:
    layer: "ogdwien:FMZKGEBOGD"
    role: "cross-check and fallback via BW_GEB_ID dissolve"
    fetched: "2026-08-03"
  typology:
    layer: "ogdwien:GEBAEUDETYPOGD"
    fetched: "2026-08-03"
  building_info:
    layer: "ogdwien:GEBAEUDEINFOOGD"
    fetched: "2026-08-03"

# Purposive sample. Selected for attribute diversity, source availability and visual
# interpretability. NOT statistically representative of Vienna's building stock.
#
# Every attribute below is SELECTION METADATA recorded at Phase 2, not pipeline output. The
# pipeline reads live values from the cached source and is never seeded from this file.
# `recon_diagnostic_area_m2` in particular was computed in the reconnaissance cos(latitude)
# frame and is ~0.743% LOW against EPSG:31256. It is not a published area; `roof_area_m2` in
# outputs/roof_attributes.json is, and the two are expected to differ by that offset.
