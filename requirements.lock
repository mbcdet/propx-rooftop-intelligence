# requirements.lock — the pinned byte-reproducibility reference environment.
#
# Resolved with pip on CPython 3.11.3 (see .python-version), macOS arm64 (Apple Silicon). This
# is the environment that produced (and re-verifies, via `make verify-repro`) the committed
# outputs/. Byte-identical artefacts are claimed ONLY under these exact versions on this
# platform; any other environment is expected to reproduce the outputs SEMANTICALLY
# (`make verify-repro-semantic`), not byte-for-byte.
#
# The lock captures EVERYTHING needed to build and run: the runtime/dev dependencies below AND
# the build toolchain (pip/setuptools/wheel) in the section at the bottom. `pip freeze` omits
# pip/setuptools/wheel, so regenerating takes two commands, not one.
#
# Regenerate after a deliberate dependency change with:
#   .venv/bin/python -m pip freeze --exclude-editable > requirements.lock
#   .venv/bin/python -m pip freeze --all | grep -E '^(pip|setuptools|wheel)==' >> requirements.lock
#   (then restore this header and the build-toolchain section comment)
# Install with:
#   make install-locked        # pip install -r requirements.lock, then -e . without build isolation
